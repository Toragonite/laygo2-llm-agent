[project]
name = "llm-layout-repro"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "laygo2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
laygo2 = { path = "third_party/laygo2", editable = true }

[tool.uv]
# The workspace has a `laygo2 -> laygo2_legacy/` symlink (empty submodule) that shadows
# the real package as a namespace package under PYTHONPATH=. unless the editable install
# is a plain path .pth entry (compat mode) instead of setuptools' import-hook finder.
config-settings-package = { laygo2 = { editable_mode = "compat" } }
